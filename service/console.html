<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Codex Remote · 电脑服务</title>
<style>
  :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #182624; background: #f4f6f5; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 32px; }
  main { max-width: 1180px; margin: auto; }
  .top, .actions, .headline { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .top { justify-content: space-between; margin-bottom: 22px; }
  h1 { margin: 5px 0; font-size: 27px; letter-spacing: -.5px; }
  .label { color: #648075; font-size: 12px; font-weight: 700; letter-spacing: 1px; }
  p { color: #61726c; font-size: 14px; line-height: 1.6; margin: 8px 0; }
  button, a.button { border: 1px solid #d6ded9; border-radius: 9px; background: #fff; padding: 10px 15px; color: #20382d; font: inherit; font-size: 13px; cursor: pointer; text-decoration: none; }
  button.primary { color: white; background: #216447; border-color: #216447; }
  button:disabled { opacity: .4; cursor: default; }
  .card { background: white; border: 1px solid #e0e6e1; border-radius: 13px; padding: 22px; margin-bottom: 18px; }
  .pill { display: inline-block; background: #e7f2ea; color: #216447; border-radius: 30px; padding: 5px 11px; font-size: 13px; }
  .pill.off { background: #f4e7e2; color: #95432e; }
  .facts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin: 20px 0; }
  .fact small { display: block; color: #77857d; margin-bottom: 6px; }
  .fact strong { font-size: 17px; }
  dl { display: grid; grid-template-columns: 100px 1fr; font-size: 13px; line-height: 1.6; margin: 0; gap: 8px 12px; }
  dt { color: #74827a; } dd { margin: 0; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; }
  h2 { margin: 0; font-size: 16px; }
  .loghead { display: flex; justify-content: space-between; margin-bottom: 14px; align-items: baseline; gap: 10px; }
  .loghead small { font-size: 12px; color: #6f8076; overflow-wrap: anywhere; }
  pre { margin: 0; background: #15251d; color: #c7e0ce; border-radius: 9px; padding: 16px; font: 12px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace; max-height: 290px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; }
  #errors { background: #f9f5f2; color: #7b594a; max-height: 130px; }
  #message { color: #95502e; }
  .footer { font-size: 12px; color: #77857d; }
  @media (max-width: 650px) { body { padding: 16px; } .facts { grid-template-columns: 1fr; } dl { grid-template-columns: 75px 1fr; } }
</style>
<main>
  <div class="top"><div><div class="label">CODEX REMOTE / 电脑服务</div><h1>这台电脑，连接手机</h1><p>查看 Agent 状态、手机连接地址和实际运行日志。</p></div>
    <div class="actions"><button id="start" class="primary">启动服务</button><button id="stop">停止服务</button><button id="refresh">刷新</button></div>
  </div>
  <div class="card">
    <div class="headline"><h2 id="device">本机 Agent</h2><span id="running" class="pill">正在读取</span></div>
    <div class="facts"><div class="fact"><small>中转服务</small><strong id="relay">—</strong></div><div class="fact"><small>本机 Agent</small><strong id="agent">—</strong></div><div class="fact"><small>主进程 / 服务端口</small><strong id="pid">—</strong></div></div>
    <dl><dt>所在目录</dt><dd id="root">—</dd><dt>启动命令</dt><dd id="command">—</dd><dt>手机连接</dt><dd id="server">—</dd><dt>网页版</dt><dd><a id="web" target="_blank" rel="noopener"></a></dd><dt>启动时间</dt><dd id="time">—</dd></dl>
    <p>手机 Settings 填写上面的连接地址；配对密钥运行 <code>npm run connection</code> 查看。</p>
    <p id="message" role="status"></p>
  </div>
  <div class="card"><div class="loghead"><h2>正常日志</h2><small id="logpath"></small></div><pre id="logs">正在读取实际日志…</pre></div>
  <div class="card"><div class="loghead"><h2>错误日志 · 含历史记录</h2><small id="errorpath"></small></div><pre id="errors"></pre></div>
  <p class="footer">每 3 秒刷新 · 管理页仅在本机开放 · 关闭管理页不会停止后台服务 · 日志时间使用 UTC</p>
</main>
<script>
  const token = '__CONSOLE_TOKEN__';
  const element = (id) => document.getElementById(id);
  let busy = false;
  function showLog(id, text) {
    const log = element(id);
    if (log.textContent === text) return;
    const atEnd = log.scrollTop + log.clientHeight >= log.scrollHeight - 8;
    log.textContent = text;
    if (atEnd) log.scrollTop = log.scrollHeight;
  }
  async function refresh() {
    try {
      const response = await fetch('/api/status');
      if (!response.ok) throw new Error('读取状态失败');
      const { status: s, logs } = await response.json();
      element('device').textContent = s.deviceName || '本机 Agent';
      element('running').textContent = s.running ? '运行中' : '已停止';
      element('running').className = 'pill' + (s.running ? '' : ' off');
      element('relay').textContent = s.relayConnected ? '已连接' : '未连接';
      element('agent').textContent = s.agentOnline ? '在线 · 可接收手机请求' : '离线';
      element('pid').textContent = `${s.pid || '—'} / ${s.port}`;
      element('root').textContent = s.root;
      element('command').textContent = s.command || 'npm run service:start';
      element('server').textContent = s.server || '启动后显示';
      element('web').textContent = s.web || '启动后显示';
      if (s.web) element('web').href = s.web;
      else element('web').removeAttribute('href');
      element('time').textContent = s.startedAt ? new Date(s.startedAt).toLocaleString('zh-CN') : '—';
      element('logpath').textContent = s.logs.normal;
      element('errorpath').textContent = s.logs.error;
      showLog('logs', logs.normal || '尚无日志。');
      showLog('errors', logs.error || '尚无错误日志。');
      element('start').disabled = busy || s.running;
      element('stop').disabled = busy || !s.running;
      if (!busy) element('message').textContent = s.error || '';
    } catch (error) { element('message').textContent = error.message; }
  }
  async function change(action) {
    busy = true;
    element('start').disabled = element('stop').disabled = true;
    element('message').textContent = action === 'start' ? '正在启动…' : '正在停止…';
    try {
      const response = await fetch(`/api/${action}`, { method: 'POST', headers: { 'X-Console-Token': token } });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error);
      element('message').textContent = action === 'start' ? '服务已启动。' : '服务已停止。';
    } catch (error) { element('message').textContent = error.message; }
    finally { busy = false; await refresh(); }
  }
  element('start').onclick = () => change('start');
  element('stop').onclick = () => change('stop');
  element('refresh').onclick = refresh;
  refresh();
  setInterval(() => { if (!busy) refresh(); }, 3000);
</script>
</html>
